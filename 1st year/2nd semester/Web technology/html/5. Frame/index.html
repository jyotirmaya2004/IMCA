<!DOCTYPE html>
<html>
<head>
  <title>Frameset Example</title>
</head>
<frameset rows="15%,*,20%">
  <frame src="header.html" name="header" noresize scrolling="no">
  <frameset cols="20%,*">
    <frame src="menu.html" name="menu">
    <frame src="home.html" name="content">
  </frameset>
  <frame src="end.html" name="end">
</frameset>
</html>
