<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>common pseudo selector</title>
	<link rel="stylesheet" href="common_pseudoclass.css">
</head>
<body>
<h2>1. Link pseudo class</h2>
<a href="#">Unvisited link</a><br>
<a href="https://google.com">Visited link</a>
<h2>2. Form pseudo classes</h2>
	<input type="text" placeholder="Focus me"><br><br>
	<input type="checkbox" id="check1">
	<label for="check1">Check me</label><br><br>
	<input type="radio" name="opt" id="r1"><label for="r1">Option 1</label>
	<input type="radio" name="opt" id="r2"><label for="r2">Option 2</label><br>
	<input type="text" value="Enabled field">
	<input type="text" value="Disabled field" disabled><br><br>
	<label for="email1">Enter your Email </label>
	<input type="email" required id="email1" placeholder="required Email"><br><br>
	<input type="text" placeholder="optional field"><br><br>
	<input type="number" min="1" max="10" placeholder="Enter 1-10"><br><br>
<h2>3. Structural Pseudo classes</h2>
<ul>
	<li>First Item</li>
	<li>Second Item</li>
	<li>Third Item</li>
</ul>
<p></p> <!--Empty paragraph-->
<p class="special">Special paragraph</p>
<p>Regular paragraph</p>
<div>
	<div>I am an only child inside this div.</div>
</div>
</body>
</html>
